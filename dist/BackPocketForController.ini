[General]

; How long Y has to be held in the Inventory, in seconds, before the highlighted item is sent to the
; Back Pocket (when it is a favourite) or taken out of it (when it is already there). A shorter press
; is handed back to the Inventory as the ordinary Favourite button. 0.20 to 2.00.
fHoldSeconds=0.50

[input]
; DirectInput scan codes for the keyboard. B = 48, V = 47. Set the optional view shortcut to 0 to disable it.
toggle_item_scan_code=48
toggle_view_scan_code=0
; An extra controller TAP binding, as a SkyUI gamepad key code (280 = Left Trigger). Off (-1) by default:
; holding Y is the controller action.
controller_toggle_item_key_code=-1

[display]
show_notifications=true

[menus]
; Hides pocketed enchanted items from the enchanter's Disenchant list.
; Pocketed unenchanted items remain available when applying a new enchantment.
hide_pocketed_from_disenchanting=true

[Debug]

; Sets the level of detail in the log: 0 = trace, 1 = debug, 2 = info, 3 = warning, 4 = error, 5 = critical error, 6 = off
uLogLevel=0
